<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Gean Martins - Hipertrofia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hipertrofia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
// aplica o tema antes de desenhar a tela (evita piscar)
(function(){var t=localStorage.getItem("gm-tema");if(t!=="claro"&&t!=="escuro")t=matchMedia("(prefers-color-scheme: light)").matches?"claro":"escuro";document.documentElement.dataset.tema=t})();
</script>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--card2:#232731;--tx:#f3f4f7;--mu:#9aa1b0;--bd:#3a3f4d;--nv:rgba(15,17,21,.92);--ac:#ff4d4d;--ac2:#ff8a3d;--ok:#2ecc71}
:root[data-tema=claro]{--bg:#f3f4f8;--card:#ffffff;--card2:#eceef4;--tx:#1b1e27;--mu:#5d6475;--bd:#c9cedb;--nv:rgba(243,244,248,.92);--ok:#1fa85a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{padding:calc(16px + env(safe-area-inset-top)) 18px 16px;background:linear-gradient(135deg,#ff4d4d,#ff8a3d);color:#fff;border-radius:0 0 26px 26px;display:flex;align-items:center;gap:10px}
header .t{flex:1;min-width:0}
header h1{margin:0;font-size:19px;letter-spacing:.2px}
header p{margin:3px 0 0;opacity:.92;font-size:13px}
.hb{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font-size:19px;display:grid;place-items:center}
#instalar{display:none;width:auto;padding:0 14px;border-radius:20px;font-size:14px;font-weight:700;background:#fff;color:#e03a3a}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:12px 14px;background:var(--nv);backdrop-filter:blur(8px);overflow-x:auto}
nav button{flex:1;min-width:58px;padding:9px 4px;border:0;border-radius:14px;background:var(--card);color:var(--mu);font-size:13px;font-weight:600;position:relative}
nav button.on{background:var(--ac);color:#fff}
nav button.hoje::after{content:"";position:absolute;top:5px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--ac2)}
nav button.on.hoje::after{background:#fff}
nav button.feito{box-shadow:inset 0 0 0 2px var(--ok)}
main{padding:4px 14px 40px;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 12px}
.top h2{margin:0;font-size:20px}.top small{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--card2);border-radius:8px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:12px;align-items:flex-start}
.card.done .info b{text-decoration:line-through;opacity:.6}
.num{flex:none;width:34px;height:34px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--ac2)}
.card.done .num{background:var(--ok);color:#fff}
.info{flex:1;min-width:0}
.info b{display:block;font-size:16px;line-height:1.25;margin-top:6px}
.chips{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.chips span{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--card2);color:var(--mu)}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.sets button{width:42px;height:42px;border-radius:50%;border:2px solid var(--bd);background:transparent;color:var(--mu);font-weight:700;font-size:15px}
.sets button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tick{width:100%;padding:12px;border:2px solid var(--bd);border-radius:14px;background:transparent;color:var(--mu);font-size:15px;font-weight:600}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.peso{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd)}
.peso input{width:84px;padding:10px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;font-weight:600;text-align:center}
.peso label{color:var(--mu);font-size:14px}
.peso .reg{padding:10px 14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:700;font-size:14px}
.peso .hist{margin-left:auto;padding:10px 12px;border:2px solid var(--bd);border-radius:12px;background:transparent;color:var(--mu);font-size:14px;font-weight:600}
.ult{font-size:12px;color:var(--mu);margin-top:6px}
.ult b{color:var(--tx)}
.foot{text-align:center;margin-top:18px}
.foot button{background:transparent;border:1px solid var(--bd);color:var(--mu);padding:10px 18px;border-radius:12px;font-size:13px}
.parab{display:none;text-align:center;padding:16px;border-radius:18px;background:var(--ok);color:#fff;font-weight:700;margin-bottom:12px}
.parab.show{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:80vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .sub{color:var(--mu);font-size:13px;margin-bottom:12px}
.sheet ol{margin:0;padding:0;list-style:none}
.sheet li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--card2);font-size:15px}
.sheet li span.d{color:var(--mu);font-size:13px;flex:1;text-align:right}
.sheet li button{border:0;background:transparent;color:var(--ac);font-size:18px}
.sheet .fechar{width:100%;margin-top:14px;padding:12px;border:0;border-radius:14px;background:var(--card2);color:var(--tx);font-weight:700;font-size:15px}
.pr{color:var(--ac2);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<header>
 <div class="t"><h1>🏋️ Gean Martins - Hipertrofia</h1><p>Marque as séries e registre a carga</p></div>
 <button class="hb" id="instalar" title="Instalar como app">⬇ Instalar</button>
 <button class="hb" id="tema" title="Tema claro ou escuro" aria-label="Alternar tema claro e escuro"></button>
</header>
<nav id="nav"></nav>
<main>
 <div class="top"><h2 id="dia"></h2><small id="cont"></small></div>
 <div class="bar"><i id="prog"></i></div>
 <div class="parab" id="parab">🎉 Treino concluído! Bom trabalho!</div>
 <div id="lista"></div>
 <div class="foot"><button id="limpar">Limpar marcações de séries deste dia</button></div>
</main>

<div class="modal" id="mhist"><div class="sheet" id="shist"></div></div>
<div class="modal" id="minst"><div class="sheet">
 <h3>Instalar como app</h3>
 <div class="sub" id="instpass"></div>
 <button class="fechar" id="instfechar">Entendi</button>
</div></div>
<div id="toast"></div>

<script>
const DIAS=[{"d": "Segunda", "f": "Pernas", "e": [{"n": "Agachamento", "s": 3, "r": "8/10 reps"}, {"n": "LegPress", "s": 4, "r": "10/12 reps"}, {"n": "Cadeira Extensora", "s": 4, "r": "10/12 reps"}, {"n": "Abdutor", "s": 3, "r": "12 reps"}, {"n": "Adutor", "s": 3, "r": "12 reps"}, {"n": "Mesa Flexora", "s": 3, "r": "12 reps"}, {"n": "Stiff", "s": 3, "r": "12 reps"}, {"n": "Elevação Pélvica", "s": 3, "r": "até a falha"}]}, {"d": "Terça", "f": "Peito e bíceps", "e": [{"n": "Supino Inclinado (váriações)", "s": 4, "r": "8/12 reps"}, {"n": "Crucifixo/Voador", "s": 4, "r": "10/12 reps"}, {"n": "Supino Declinado/Cross Over", "s": 4, "r": "10/12 reps"}, {"n": "Elevação Lateral", "s": 3, "r": "12/15 reps"}, {"n": "Rosca 45º Graus", "s": 4, "r": "8/10 reps"}, {"n": "Scott", "s": 4, "r": "8/10 reps"}, {"n": "Rosca Martelo", "s": 4, "r": "até a falha"}, {"n": "Cardio", "s": 0, "r": "10 min · livre escolha", "cardio": true}]}, {"d": "Quarta", "f": "Costas e tríceps", "e": [{"n": "Pulley Costas", "s": 3, "r": "8/10 reps"}, {"n": "Remada", "s": 3, "r": "8/10 reps"}, {"n": "Pulldown", "s": 4, "r": "10/12 reps"}, {"n": "Voador Invertido", "s": 3, "r": "12/15 reps"}, {"n": "Tríceps Francesa", "s": 4, "r": "8/10 reps"}, {"n": "Pulley Tríceps", "s": 4, "r": "8/10 reps"}, {"n": "Tríceps Testa", "s": 4, "r": "8/10 reps"}, {"n": "Cardio", "s": 0, "r": "12 min · livre escolha", "cardio": true}]}, {"d": "Quinta", "f": "Ombros e braços", "e": [{"n": "Elevação Lateral", "s": 4, "r": "8/10 reps"}, {"n": "Frontal ou Desenvolvimento", "s": 4, "r": "8/10 reps"}, {"n": "Voador Invertido", "s": 4, "r": "8/10 reps"}, {"n": "Encolhimento de Ombro", "s": 4, "r": "até a falha"}, {"n": "Tríceps Francesa", "s": 4, "r": "8/10 reps"}, {"n": "Rosca 45º Graus", "s": 4, "r": "8/10 reps"}, {"n": "Cardio", "s": 0, "r": "15 min · livre escolha", "cardio": true}]}, {"d": "Sexta", "f": "Peito e bíceps", "e": [{"n": "Supino Inclinado (váriações)", "s": 4, "r": "8/12 reps"}, {"n": "Crucifixo/Voador", "s": 4, "r": "10/12 reps"}, {"n": "Supino Declinado/Cross Over", "s": 4, "r": "10/12 reps"}, {"n": "Elevação Lateral", "s": 3, "r": "12/15 reps"}, {"n": "Rosca 45º Graus", "s": 4, "r": "8/10 reps"}, {"n": "Francesa", "s": 4, "r": "8/10 reps"}, {"n": "Scott", "s": 4, "r": "até a falha"}]}];
const KEY="treino-gean-v1", KP="treino-gean-pesos-v1";
let st=JSON.parse(localStorage.getItem(KEY)||"{}");
let pesos=JSON.parse(localStorage.getItem(KP)||"{}"); // {nomeDoExercicio:[{p:40,d:"2026-11-23"}]}
const hojeIdx=(()=>{const d=new Date().getDay();return d>=1&&d<=5?d-1:0})();
let atual=hojeIdx;
const save=()=>localStorage.setItem(KEY,JSON.stringify(st));
const savePesos=()=>localStorage.setItem(KP,JSON.stringify(pesos));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtKg=n=>String(n).replace(".",",")+" kg";
const hoje=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtData=s=>{const[a,m,d]=s.split("-");return d+"/"+m+"/"+a.slice(2)};
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1800)}

/* ---- tema ---- */
function aplicaTema(t){document.documentElement.dataset.tema=t;$("tema").textContent=t==="claro"?"🌙":"☀️";
 document.querySelector('meta[name=theme-color]').content=t==="claro"?"#f3f4f8":"#0f1115"}
$("tema").onclick=()=>{const n=document.documentElement.dataset.tema==="claro"?"escuro":"claro";localStorage.setItem("gm-tema",n);aplicaTema(n)};
aplicaTema(document.documentElement.dataset.tema);

/* ---- treino ---- */
function total(di){return DIAS[di].e.reduce((a,x)=>a+(x.cardio?1:x.s),0)}
function feitos(di){const o=st[di]||{};return Object.values(o).reduce((a,v)=>a+v,0)}
function nav(){
 const n=$("nav");n.innerHTML="";
 DIAS.forEach((d,i)=>{const b=document.createElement("button");
  b.textContent=d.d.slice(0,3);
  b.className=(i===atual?"on ":"")+(i===hojeIdx?"hoje ":"")+(feitos(i)>=total(i)?"feito":"");
  b.onclick=()=>{atual=i;render()};n.appendChild(b)});
}
function ultimo(nome){const h=pesos[nome];return h&&h.length?h[h.length-1]:null}
function render(){
 const d=DIAS[atual];
 $("dia").textContent=d.d+" · "+d.f;
 const L=$("lista");L.innerHTML="";
 const o=st[atual]=st[atual]||{};
 d.e.forEach((x,i)=>{
  const c=document.createElement("div");c.className="card"+(x.cardio?" cardio":"");
  const v=o[i]||0, fim=x.cardio?v>=1:v>=x.s;
  if(fim)c.classList.add("done");
  let h=`<div class="row"><div class="num">${fim?"✓":i+1}</div><div class="info"><b>${x.cardio?"🏃 Cardio":esc(x.n)}</b><div class="chips">`;
  h+=x.cardio?`<span>${esc(x.r)}</span>`:`<span>${x.s} séries</span><span>${esc(x.r)}</span>`;
  h+=`</div>`;
  if(x.cardio)h+=`<button class="tick${v?" on":""}">${v?"Feito ✓":"Marcar como feito"}</button>`;
  else{h+=`<div class="sets">`;for(let s=1;s<=x.s;s++)h+=`<button data-s="${s}" class="${s<=v?"on":""}">${s}</button>`;h+=`</div>`}
  h+=`</div></div>`;
  if(!x.cardio){
   const u=ultimo(x.n);
   h+=`<div class="peso"><label>Carga</label><input type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg" value="${u?u.p:""}"><button class="reg">Registrar</button><button class="hist">📈 Histórico</button></div>`;
   h+=`<div class="ult">${u?`Último registro: <b>${fmtKg(u.p)}</b> em ${fmtData(u.d)}`:"Nenhuma carga registrada ainda"}</div>`;
  }
  c.innerHTML=h;
  c.querySelectorAll(".sets button").forEach(b=>b.onclick=()=>{const s=+b.dataset.s;o[i]=(o[i]===s)?s-1:s;save();render()});
  const t=c.querySelector(".tick");if(t)t.onclick=()=>{o[i]=v?0:1;save();render()};
  const reg=c.querySelector(".reg");
  if(reg){
   const inp=c.querySelector("input");
   reg.onclick=()=>{const p=parseFloat(String(inp.value).replace(",","."));
    if(inp.value===""||!(p>=0)){toast("Digite a carga em kg");return}
    const hh=pesos[x.n]=pesos[x.n]||[];
    const dt=hoje(), ult=hh[hh.length-1];
    if(ult&&ult.d===dt)ult.p=p; else hh.push({p,d:dt}); // um registro por dia; registrar de novo no mesmo dia corrige o valor
    savePesos();toast("Carga registrada: "+fmtKg(p));render()};
   c.querySelector(".hist").onclick=()=>abreHist(x.n);
  }
  L.appendChild(c);
 });
 const f=feitos(atual),t=total(atual);
 $("prog").style.width=(f/t*100)+"%";
 $("cont").textContent=f+" de "+t+" séries";
 $("parab").classList.toggle("show",f>=t);
 nav();
}
function abreHist(nome){
 const h=pesos[nome]||[];
 const max=h.reduce((a,x)=>Math.max(a,x.p),0);
 let s=`<h3>${esc(nome)}</h3><div class="sub">${h.length?`${h.length} registro(s) · maior carga: <span class="pr">${fmtKg(max)}</span>`:"Nenhum registro ainda."}</div><ol>`;
 for(let i=h.length-1;i>=0;i--){
  const x=h[i], ant=h[i-1];
  const dif=ant?(x.p-ant.p):0;
  const seta=!ant?"":dif>0?` <span class="pr">▲ ${String(dif).replace(".",",")}</span>`:dif<0?` ▼ ${String(-dif).replace(".",",")}`:" =";
  s+=`<li><b>${fmtKg(x.p)}</b>${seta}<span class="d">${fmtData(x.d)}</span><button data-i="${i}" aria-label="Apagar registro">🗑</button></li>`;
 }
 s+=`</ol><button class="fechar">Fechar</button>`;
 $("shist").innerHTML=s;$("mhist").classList.add("show");
 $("shist").querySelector(".fechar").onclick=()=>$("mhist").classList.remove("show");
 $("shist").querySelectorAll("li button").forEach(b=>b.onclick=()=>{
  if(!confirm("Apagar este registro?"))return;
  h.splice(+b.dataset.i,1);if(!h.length)delete pesos[nome];savePesos();abreHist(nome);render()});
}
$("mhist").onclick=e=>{if(e.target===$("mhist"))$("mhist").classList.remove("show")};
$("limpar").onclick=()=>{if(confirm("Limpar as marcações de séries de "+DIAS[atual].d+"? (as cargas registradas não são apagadas)")){st[atual]={};save();render()}};

/* ---- instalar como app ---- */
let evInst=null;
const jaInstalado=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
function mostraBotao(){$("instalar").style.display=jaInstalado()?"none":"grid"}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();evInst=e;mostraBotao()});
addEventListener("appinstalled",()=>{evInst=null;mostraBotao();toast("App instalado!")});
$("instalar").onclick=async()=>{
 if(evInst){evInst.prompt();await evInst.userChoice;evInst=null;return}
 $("instpass").innerHTML=ios
  ?"No iPhone: abra esta página no <b>Safari</b>, toque no botão de compartilhar (quadrado com seta para cima) e escolha <b>Adicionar à Tela de Início</b>."
  :"No Android: abra o menu do navegador (três pontinhos) e toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>. No computador, use o ícone de instalar na barra de endereço.";
 $("minst").classList.add("show")};
$("instfechar").onclick=()=>$("minst").classList.remove("show");
$("minst").onclick=e=>{if(e.target===$("minst"))$("minst").classList.remove("show")};
mostraBotao();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

render();
</script>
</body>
</html>
